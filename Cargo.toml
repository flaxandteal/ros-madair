[workspace]
# v2 static-assets stack only. The v1 SPARQL/page-index island
# (core/builder/client/alizarin/napi) was a hand-rolled reimplementation of what
# Parquet zone-maps + DuckDB give natively (quantize/summary_quads/page_file/
# hilbert/resource_map); it was already retired (Clódóir went v2-only) and is now
# removed. The read/prune mechanism is being replaced by a DuckDB+Parquet
# substrate; what remains RM-specific is overlay/layering, reverse traversal
# (cited_by), and Arches tile-graph hydration.
members = [
    "crates/ros-madair-handlers",
    "crates/ros-madair-format",
    "crates/ros-madair-query",
    "crates/ros-madair-emit",
    "crates/ros-madair-python",
    "crates/ros-madair-duck",
]
default-members = [
    "crates/ros-madair-handlers",
    "crates/ros-madair-format",
    "crates/ros-madair-query",
    "crates/ros-madair-emit",
    "crates/ros-madair-duck",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.16"
authors = ["Phil Weir <phil.weir@flaxandteal.co.uk>"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/flaxandteal/ros-madair"
homepage = "https://github.com/flaxandteal/ros-madair"
keywords = ["sparql", "wasm", "heritage", "rdf", "static-files"]
categories = ["database", "wasm", "web-programming"]

[profile.release]
opt-level = "s"
debug = true

[profile.dev]
debug = true


[workspace.dependencies]
# The governance core: the PUBLISHED upstream alizarin release from crates.io. A pinned
# registry version — reproducible, no local checkout, no CI sibling-vendoring, and it
# keeps RM's own crates crates.io-publishable (all deps are registry versions). Bump the
# version to move alizarin. alizarin-clm-core (handlers) is the same version from crates.io.
# (No [patch] blocks: one registry source already unifies every alizarin-core in the graph.)
alizarin-core = "2.0.0-beta.9"
