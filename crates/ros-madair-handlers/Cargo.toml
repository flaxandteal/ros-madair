[package]
name = "ros-madair-handlers"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The single source of the Rós Madair extension-type registry: handler declarations shared by emitter and query side (WASM-buildable)"

[dependencies]
# HARD CONSTRAINT: this crate must build for wasm32-unknown-unknown — a
# browser consumer queries a snapshot and needs the same registry that
# produced it, without dragging in the emitter's SQLite writer. Keep the
# dependency set to the governance core + the handler providers.
alizarin-core.workspace = true
alizarin-clm-core = { path = "../../../alizarin-sandbox/crates/alizarin-clm-core" }
serde = { version = "1", features = ["derive"] }

# WASM: alizarin-core pulls uuid v4 → getrandom 0.2, which refuses to build for
# wasm32-unknown-unknown unless told where randomness comes from. Enabling the
# `js` feature here (feature unification) makes the browser target build without
# patching alizarin-core. Native targets are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
