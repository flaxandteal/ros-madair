[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ros-madair"
# Version is NOT hardcoded here — maturin reads it from the crate's Cargo.toml
# (`version.workspace = true` → the workspace version). This is the ONE source of
# truth, so a hand-bumped Cargo version can't leave the wheel behind (which is how
# a24 shipped to PyPI while crates/npm were a25). `scripts/sync-version.sh` bumps
# the Cargo workspace version; nothing to sync here.
dynamic = ["version"]
description = "Python binding for the Rós Madair v2 query compiler (head-schema IR to SQL), with the CLM reference handler registered"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# Pure Rust extension. The module is `ros_madair`, NOT `ros_madair`: v1's
# ros-madair-builder already owns `ros_madair` (IndexBuilder/IndexReader, which
# Clódóir imports), so the two coexist during the transition.
module-name = "ros_madair"
