name: Release Package

# Tag-triggered release for the DuckDB + Parquet substrate. Publishes:
#   - the Rust crates (handlers, query, format, emit, duck) to crates.io;
#   - the ros-madair-python wheel to PyPI (manylinux);
#   - a GitHub Release carrying the emit CLI binary.
# alizarin is a published crates.io dependency now, so there is NO sibling vendoring and
# the crates are publishable (all deps are registry versions).
#
# Credentials:
#   - crates.io: CARGO_REGISTRY_TOKEN repo secret. Needed at least for the FIRST publish
#     of each crate — that first `cargo publish` is what CLAIMS the name (crates.io has no
#     browser-side name reservation, and its own Trusted Publishing requires the crate to
#     already exist, so it cannot bootstrap a brand-new name). The publish step is skipped
#     if the secret is absent.
#   - PyPI: NO secret — the python-wheel job uses Trusted Publishing (OIDC). See its comment.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0-alpha.16)'
        required: true
        type: string

env:
  # sccache in LOCAL-DISK mode (see ci.yml for why: the GHA cache backend hits the
  # legacy Actions cache API that now 400s and fails sccache startup). The python-wheel
  # job builds in a manylinux container without sccache, so it unsets RUSTC_WRAPPER.
  RUSTC_WRAPPER: "sccache"
  SCCACHE_DIR: "/home/runner/.cache/sccache"

jobs:
  # ── Rust crates → crates.io (dependency order) ───────────────────────────────
  crates-io:
    name: Publish crates → crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      CC: "sccache gcc"
      CXX: "sccache g++"
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6
      - name: sccache disk cache (local; see ci.yml)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true   # keep the DuckDB build across runs even on failure
      - name: Publish in dependency order
        if: env.CARGO_REGISTRY_TOKEN != ''
        # --no-verify: skip cargo's isolated re-build-and-test of each packaged crate.
        # That verify step runs in a throwaway, version-stamped dir, which defeats BOTH
        # caches (rust-cache keys on target/; sccache's C/C++ key carries the changing
        # -I<OUT_DIR> path), so the bundled libduckdb amalgamation recompiled ~fully (~12
        # min) EVERY release. CI (ci.yml) already builds AND tests the exact workspace, so
        # the verify pass only re-proves what CI proved. The per-crate sleep STAYS: it is
        # not for the (now-skipped) verify build but for crates.io's SERVER-SIDE dependency
        # check — each crate pins `=` deps, so the one before it must be queryable first.
        run: |
          for crate in ros-madair-handlers ros-madair-query ros-madair-format ros-madair-compile ros-madair-emit ros-madair-duck; do
            echo "::group::cargo publish $crate"
            cargo publish -p "$crate" --no-verify \
              || echo "::warning::publish $crate failed (already at this version, or crate name not yet owned) — continuing"
            echo "::endgroup::"
            sleep 25   # let crates.io index the just-published crate before the next crate's dep check
          done

  # ── Browser compiler → npm (ros-madair, Trusted Publishing / OIDC — NO token) ─
  # ros-madair-wasm (wasm-bindgen over ros-madair-compile) ships as the npm package
  # `ros-madair` — the browser's half of the ONE compiler, consumed by ros-madair-docs
  # exactly as it consumes `alizarin`. wasm-pack names the package after the crate, so
  # we rename it to `ros-madair` before publishing.
  #
  # Auth is OIDC Trusted Publishing: `npm publish` mints a short-lived credential from
  # the GitHub OIDC token (needs `id-token: write` + npm >= 11.5.1), so there is NO
  # stored NPM_TOKEN, and the publish carries provenance attestations automatically.
  #
  # Prereq (one-time): unlike PyPI, npm has NO pending-publisher — the trusted publisher
  # is configured on an EXISTING package. So the brand-new name must be claimed once:
  #   1. `wasm-pack build … --target web`, rename the pkg name to `ros-madair`, and
  #      `npm publish` it ONCE from a logged-in machine (`npm login`; no CI secret).
  #   2. On npmjs.com → the `ros-madair` package → Settings → Trusted Publisher, add
  #      GitHub owner=flaxandteal, repo=<this repo>, workflow=`release.yml`.
  # Every tagged release after that publishes through OIDC here with no token.
  npm-package:
    name: Browser compiler → npm (trusted publishing)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write   # required: lets the job mint the OIDC token npm exchanges
    env:
      # This job builds with wasm-pack but installs no sccache, so the workflow-level
      # RUSTC_WRAPPER=sccache would make `cargo metadata`/rustc fail with "sccache …
      # No such file or directory" (same leak as the python-wheel job). Unset it.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        # PIN the wasm-pack version. Left unset, the action tries to resolve "latest"
        # from the GitHub API and, when that lookup fails (rate-limit/network), silently
        # falls back to its baked-in v0.9.1 — which predates `--no-opt` and fails the
        # build step at argument parsing (bit the alpha.27 release). Pin so it can't.
        with:
          version: 'v0.13.1'
      - name: Build the wasm package (target web; no libduckdb in its graph)
        # --no-opt: skip wasm-opt so the release can't be broken by a flaky binaryen
        # download. The ~1.7 MB module gzips to a few hundred KB; enable opt later once
        # wasm-opt is cached if size matters.
        run: wasm-pack build crates/ros-madair-wasm --target web --release --no-opt --out-dir pkg
      - name: Rename the npm package to `ros-madair` (wasm-pack names it after the crate)
        run: |
          node -e "const fs=require('fs');const p='crates/ros-madair-wasm/pkg/package.json';const j=JSON.parse(fs.readFileSync(p));j.name='ros-madair';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest
      - name: Publish to npm (OIDC — no token)
        working-directory: crates/ros-madair-wasm/pkg
        # npm refuses to publish a prerelease to the default `latest` dist-tag, so
        # derive the tag from the version (alpha/beta/rc → that tag; stable → latest).
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG=latest
          case "$VER" in *-alpha*) TAG=alpha ;; *-beta*) TAG=beta ;; *-rc*) TAG=rc ;; esac
          echo "Publishing ros-madair@$VER under dist-tag '$TAG'"
          npm publish --access public --tag "$TAG"

  # ── PyO3 wheel → PyPI (Trusted Publishing / OIDC — NO token) ──────────────────
  # PyPI mints the upload credential from a short-lived GitHub OIDC token instead of
  # a stored secret. Prereq (one-time, in the PyPI UI): register a Trusted Publisher
  # for project `ros-madair` → GitHub owner=flaxandteal, repo=<this repo>,
  # workflow=`release.yml`. Register it as a *pending publisher* BEFORE the first
  # release so the very first OIDC upload creates AND claims the project name — no
  # token is ever needed, not even to bootstrap.
  python-wheel:
    name: Python wheel → PyPI (trusted publishing)
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required: lets the job mint the OIDC token PyPI exchanges
    env:
      RUSTC_WRAPPER: ""   # sccache isn't installed in the manylinux container; don't wrap
    steps:
      - uses: actions/checkout@v4
      # manylinux container: alizarin now resolves from crates.io INSIDE the container
      # (no local sibling path to mount), so a portable manylinux wheel builds cleanly.
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # --strip: profile.release keeps debug=true (for native backtraces), which
          # bloats the statically-bundled-DuckDB wheel past PyPI's 100 MB limit.
          # Strip the extension module in the wheel only.
          args: --release --strip -m crates/ros-madair-python/Cargo.toml --out dist
          # 2_28 (not auto=manylinux2014): the bundled DuckDB amalgamation rejects
          # the legacy devtoolset CXX ABI on 2014 ("DuckDB does not provide
          # extensions for this (legacy) CXX ABI"); 2_28 ships a modern GCC.
          manylinux: 2_28
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
      - name: Publish to PyPI (OIDC — no token)
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ── emit CLI binary + GitHub Release ─────────────────────────────────────────
  release:
    name: CLI binary + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CC: "sccache gcc"
      CXX: "sccache g++"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6
      - name: sccache disk cache (local; see ci.yml)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true   # keep the DuckDB build across runs even on failure
      - name: Build emit CLI (release)
        run: cargo build --release -p ros-madair-emit
      - name: Package binary
        run: |
          cp target/release/ros-madair-emit ros-madair-emit-linux-amd64
          chmod +x ros-madair-emit-linux-amd64
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: Rós Madair ${{ steps.v.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.v.outputs.version, 'alpha') || contains(steps.v.outputs.version, 'beta') || contains(steps.v.outputs.version, 'rc') }}
          files: ros-madair-emit-linux-amd64
          body: |
            Rós Madair ${{ steps.v.outputs.version }} — DuckDB + Parquet static-file query substrate.

            - **Rust** — `ros-madair-{handlers,query,format,emit,duck}` on crates.io.
            - **Python** — the `ros-madair-python` wheel on PyPI.
            - **CLI** — `ros-madair-emit-linux-amd64` compiles a data_dir into the substrate
              (`tiles/edges/concepts/ordered` Parquet + manifest).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
