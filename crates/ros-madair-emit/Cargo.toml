# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "ros-madair-emit"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Compile alizarin-governed data into Rós Madair static query artifacts (head DB, chunks, closure, manifest)"

[[bin]]
name = "ros-madair-emit"
path = "src/main.rs"

[dependencies]
alizarin-core.workspace = true
# A8.2: geometry → bounding box at emit. Native-only — the query side needs no
# geojson (it compares f64 corners), so this never reaches the WASM query path.
geojson = "0.24"
ros-madair-query = { path = "../ros-madair-query" }
ros-madair-handlers = { path = "../ros-madair-handlers" }
ros-madair-format = { path = "../ros-madair-format" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rmp-serde = "1"
sha2 = "0.10"
# Signing half of the attestation layer (native Ed25519 keygen + sign). Optional
# so the emitter CAN be built crypto-free, but ON by default (see [features]):
# every emitted head/overlay is signed at L0. Verify types come from the format
# crate; here we hold the private key. getrandom mints the 32-byte seed (no `rand`
# pulled in); base64 encodes key/sig for the JSON envelope.
ed25519-dalek = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.2", optional = true }
# The DuckDB+Parquet substrate writer (`parquet.rs`). The tile path STREAMS
# through a file-backed DuckDB staging table + `COPY … ORDER BY` (external,
# disk-spilling sort) so a full-corpus build is memory-bounded — the same engine
# that reads the substrate also writes it. Arrow/parquet remain for the small
# in-memory concept-catalog writer.
# `parquet` statically links the parquet extension so `COPY … TO (FORMAT parquet)`
# works OFFLINE — without it the writer autoloads and tries to download the
# extension, impossible on Android (no android binaries; verified on-device).
duckdb = { version = "1", features = ["bundled", "json", "parquet"] }
arrow = "58"
parquet = "58"

[features]
# Sign every emitted head/overlay (L0, default-on). Also turns on the format
# crate's verify half explicitly, so `--no-default-features` on either crate is
# coherent (both off ⇒ a crypto-free emitter).
default = ["attest"]
attest = [
    "dep:ed25519-dalek",
    "dep:base64",
    "dep:getrandom",
    "ros-madair-format/attest",
]

[dev-dependencies]
# The `hydrate_entry` example is a driver over the library read path — it does
# not (any more) re-implement it. Dev-only: the emitter itself never reads.
ros-madair-read = { path = "../ros-madair-read" }
# So the Parquet-emit integration test can read its own output back and assert
# on the promoted columns (integration tests don't see the crate's normal deps).
arrow = "58"
parquet = "58"
alizarin-core.workspace = true
