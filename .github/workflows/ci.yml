name: Check code

# Per-PR check tier for the DuckDB/Parquet substrate: fmt + clippy + the full test
# suite (incl. the duck/parquet path), plus a pyo3 compile check. The v1 wasm/napi
# client jobs were removed with the v1 client crates (browser runtime → DuckDB-WASM,
# substrate slice 4). alizarin is a published crates.io dependency now (no sibling
# vendoring — see the workspace Cargo.toml).
#
# CACHING the bundled libduckdb build (~12 min cold): Swatinem/rust-cache restores
# target/ on an unchanged Cargo.lock; sccache (GHA backend) caches the C++ amalgamation
# at the object level so an unrelated dep bump still skips the C++ recompile.

on:
  push:
    branches: [main, "dev/*"]
  pull_request:
  workflow_dispatch:

env:
  # sccache in LOCAL-DISK mode, persisted with actions/cache (see each job). We do NOT
  # set SCCACHE_GHA_ENABLED: that backend talks to the legacy Actions cache API
  # (artifactcache.actions.githubusercontent.com), which now returns hard 400s and fails
  # sccache *startup* — killing every compile before it runs. Local disk can't fail to
  # start, and an actions/cache outage is non-fatal (warn + continue). restore-keys keep
  # the C++ object cache across Cargo.lock changes, so DuckDB isn't recompiled.
  RUSTC_WRAPPER: "sccache"
  SCCACHE_DIR: "/home/runner/.cache/sccache"

jobs:
  # ── Rust: fmt + clippy + the full test suite (incl. the duck/parquet path) ──
  rust:
    name: Rust (fmt, clippy, test) + duck/parquet build
    runs-on: ubuntu-latest
    env:
      CC: "sccache gcc"
      CXX: "sccache g++"
    steps:
      - uses: actions/checkout@v4
      # Pinned (not @stable) so rustfmt's style + clippy's lint set are frozen —
      # matches rust-toolchain.toml so CI and local agree. A stable bump used to
      # silently redden `cargo fmt --all -- --check` with no source change.
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6
      - name: sccache disk cache (local; C++ objects survive Cargo.lock changes)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-
      - name: Rust cache (restores compiled libduckdb-sys on Cargo.lock hit)
        uses: Swatinem/rust-cache@v2
        with:
          # Persist target/ even when a LATER step fails. Default is false, which
          # would throw away the (successful, expensive ~12-min) libduckdb-sys build
          # whenever clippy/tests fail — forcing the next push to recompile DuckDB.
          # With this, a red run still banks the C++ build for the next push. (sccache
          # separately banks the C++ objects at compile time, independent of Cargo.lock.)
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace (bundled duckdb+json+parquet compiled in ros-madair-duck)
        run: cargo test --workspace
      - name: Build the emit CLI binary (release)
        run: cargo build --release -p ros-madair-emit
      - name: sccache stats (confirm the C++ compiles are being cached)
        run: sccache --show-stats

  # ── Python (pyo3: ros-madair-python; may pull duckdb -> CC wrap) ──
  python:
    name: Python (pyo3)
    runs-on: ubuntu-latest
    env:
      CC: "sccache gcc"
      CXX: "sccache g++"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.6
      - name: sccache disk cache (local; see rust job)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true   # keep the DuckDB build on a failed run (see rust job)
      - name: Check pyo3 bindings compile
        run: cargo check -p ros-madair-python
