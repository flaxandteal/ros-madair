[package]
name = "ros-madair-format"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The Rós Madair static-artifact FORMAT: manifest contract types + attestation verify, shared by the writer and readers (WASM-buildable)"

[dependencies]
# HARD CONSTRAINT: this crate must build for wasm32-unknown-unknown — a
# browser/native READER parses the manifest and verifies its attestation but
# never emits. No rusqlite, no filesystem: contract + trust types only.
ros-madair-handlers = { path = "../ros-madair-handlers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The snapshot-id digest (a hash over artifact hashes + the id-excluded manifest)
# lives here now — the ONE derivation both the writer (emit) and the reader-side
# `verify` module share, so a signed id and a recomputed id cannot drift. Pure,
# wasm-clean.
sha2 = "0.10"
# Attestation VERIFY (authenticity over snapshot_id) — behind the `attest`
# feature so a render/parse-only consumer (and the browser bundle) pulls NO
# curve25519. Verify-only: no RNG, no std — ed25519-dalek's verify path is
# no_std and builds for wasm32-unknown-unknown (ring would NOT). Signing/keygen
# is native, in the emit crate.
ed25519-dalek = { version = "2", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
# Multibase (base58btc) for the W3C sec:publicKeyMultibase representation of an
# ed25519 key (the z6Mk… DID-key form) that ties an attestation's signer to a
# named actor. Pure-Rust, wasm-clean.
bs58 = { version = "0.5", optional = true }

[features]
# Authenticity layer ON by default: heads sign, readers verify, out of the box.
# It stays a removable EXTENSION though — a lean/render-only consumer (or a
# size-sensitive browser bundle) drops all curve25519 with
# `default-features = false`. So: opt-OUT, not baked in.
default = ["attest"]
attest = ["dep:ed25519-dalek", "dep:base64", "dep:bs58"]

# WASM: alizarin-core pulls uuid v4 → getrandom 0.2, which refuses to build for
# wasm32-unknown-unknown unless told where randomness comes from. Enabling the
# `js` feature here (feature unification) makes the browser target build without
# patching alizarin-core. Native targets are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
