[package]
name = "ros-madair-compile"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The pure Query IR → DuckDB SQL lowering (no libduckdb): compile_expr over the tile-row + edge + melted-store schema. Builds for wasm32 so the browser and native share ONE compiler."

[dependencies]
alizarin-core.workspace = true
ros-madair-query = { path = "../ros-madair-query", version = "0.1.0-alpha.26" }
# The shared grid-cell contract: emit stores `grid_cell`, the compiler lowers a
# GridBox to `cell IN (cells_in_box(...))` — the SAME scheme, from ONE crate, or
# the IN silently misses. Handlers is wasm-clean, so compile stays wasm-buildable.
ros-madair-handlers = { path = "../ros-madair-handlers", version = "0.1.0-alpha.26" }
serde_json = "1"

# WASM: alizarin-core pulls uuid v4 → getrandom 0.2, which refuses to build for
# wasm32-unknown-unknown unless told where randomness comes from. The `js` feature
# (feature unification) makes the browser target build. Native targets unaffected.
# This is the whole point of the crate: it must build for wasm32 (unlike duck).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
