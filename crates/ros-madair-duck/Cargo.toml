[package]
name = "ros-madair-duck"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Slice 2 of the DuckDB+Parquet substrate: the shared structured read path — compile the Rós Madair Query IR to DuckDB SQL over tile-row Parquet, with exact spatial."

[dependencies]
# The native DuckDB Rust binding (rusqlite-shaped API). `bundled` compiles the
# libduckdb amalgamation, so this crate is self-contained on desktop. The same
# engine/SQL runs as DuckDB-WASM in the browser — this is the native side of one
# shared substrate, not a second backend.
# `json` AND `parquet` statically compile those extensions into the bundled
# libduckdb, so `json_extract*` and `read_parquet` work OFFLINE with no
# `INSTALL`/network. NB: parquet is NOT core in the bundled amalgamation — without
# the `parquet` feature, `read_parquet` autoloads and tries to DOWNLOAD the
# extension, which fails offline on Android (no android extension binaries exist;
# verified on-device). The spatial extension is NOT cargo-bundleable — it loads
# from a local `.duckdb_extension` file via `extension_directory` (see `open_offline`).
duckdb = { version = "1", features = ["bundled", "json", "parquet"] }
# Reuse the ONE typed query IR — the same `Query`/`Expr` the head-SQL compiler
# takes — so both backends answer the same queries. This crate is the second
# compiler for that IR (→ DuckDB SQL), not a second IR.
ros-madair-query = { path = "../ros-madair-query", version = "0.1.0-alpha.16" }
# THE registry: the CLM `reference` handler `hydrate_tiles_with_labels` renders
# reference fields through (in the `hydrate` module — the tile→tree half, moved
# here from the retired ros-madair-read crate).
ros-madair-handlers = { path = "../ros-madair-handlers", version = "0.1.0-alpha.16" }
# The snapshot contract + reader-side attestation VERIFY (`format::verify`):
# `open_layers` refuses a layer whose signed content has been altered. `attest`
# is on by default, so this pulls the verify half (no signing/keys here).
ros-madair-format = { path = "../ros-madair-format", version = "0.1.0-alpha.16" }
alizarin-core.workspace = true
serde_json = "1"

[dev-dependencies]
ros-madair-emit = { path = "../ros-madair-emit", version = "0.1.0-alpha.16" }
ros-madair-handlers = { path = "../ros-madair-handlers", version = "0.1.0-alpha.16" }
# Integration tests don't see the crate's normal deps — mirror the ones the
# parity test builds queries and graphs with.
ros-madair-query = { path = "../ros-madair-query", version = "0.1.0-alpha.16" }
alizarin-core.workspace = true
serde_json = "1"
# So the descendant test can COPY tiny tiles/concepts Parquets to drive the
# range-join directly, without the SKOS-emit path.
duckdb = { version = "1", features = ["bundled"] }
